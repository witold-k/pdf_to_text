[package]
name = "pdf_to_text"
version = "0.1.0"
edition = "2024"

[dependencies]
# -- serializer --------------------------------------------------------------
serde = { version = "1.0", features = ["derive", "rc"] }
postcard = { version = "1.1.3", features = ["alloc"] }
serde_json = "1"

# -- converters --------------------------------------------------------------
roxmltree = "0.21"
simplelexer = { version = "0.1.0", git = "https://github.com/witold-k/simplelexer", rev = "9b04c15e393feac77c621dd72b35bc74607054a9" }

# -- fsscan ------------------------------------------------------------------
fsscanner = { version = "0.4.0", git = "https://github.com/witold-k/fsscanner", rev = "57d24691489d5ccbb9b6587faca97ed8429055a5" }

# -- database ----------------------------------------------------------------
token_db = { version = "0.1.0", git = "https://github.com/witold-k/token_db", rev = "a347088581b40d53f1b0d288004e5be771736e9d" }

# -- rest --------------------------------------------------------------------
ureq = { version = "3.4", default-features = false, features = ["multipart"] }

